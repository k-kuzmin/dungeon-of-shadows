name: Copilot Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          git diff "$BASE_SHA"..."$HEAD_SHA" -- '*.cs' '*.json' '*.yml' '*.yaml' '*.csproj' > pr_diff.txt
          # Ограничиваем размер diff до ~60KB чтобы не превысить контекст модели
          head -c 60000 pr_diff.txt > pr_diff_trimmed.txt
          echo "trimmed=$([ $(wc -c < pr_diff.txt) -gt 60000 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Review with GPT-4.1
        uses: actions/github-script@v7
        env:
          DIFF_TRIMMED: ${{ steps.diff.outputs.trimmed }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('pr_diff_trimmed.txt', 'utf8');

            if (!diff.trim()) {
              console.log('Empty diff, skipping review');
              return;
            }

            const trimmedNote = process.env.DIFF_TRIMMED === 'true'
              ? '\n\n> **Note:** Diff был обрезан из-за большого размера. Ревью покрывает только первые ~60KB изменений.'
              : '';

            const prTitle = context.payload.pull_request.title;
            const prBody = context.payload.pull_request.body || '';

            const systemPrompt = `Ты — опытный code reviewer для C# игрового проекта (Action Roguelike на Raylib-cs, .NET 8).
            Проводи ревью на русском языке. Будь конкретным и полезным.

            Формат ответа:
            ## 🔍 Code Review

            ### Критичные замечания
            (баги, уязвимости, потеря данных — или "Нет")

            ### Рекомендации
            (улучшения качества, читаемости, производительности)

            ### Итог
            (краткая оценка PR в 1-2 предложения)

            Не повторяй diff. Ссылайся на файлы и строки. Если всё хорошо — скажи что всё хорошо, не придумывай замечания.`;

            const userPrompt = `PR: ${prTitle}
            ${prBody ? `\nОписание: ${prBody}` : ''}

            Diff:
            \`\`\`diff
            ${diff}
            \`\`\``;

            // Вызов GitHub Models API (Claude Sonnet)
            const response = await fetch('https://models.github.ai/inference/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model: 'openai/gpt-4.1',
                messages: [
                  { role: 'system', content: systemPrompt },
                  { role: 'user', content: userPrompt }
                ],
                max_tokens: 4096,
                temperature: 0.3
              })
            });

            if (!response.ok) {
              const errorText = await response.text();
              throw new Error(`GitHub Models API error ${response.status}: ${errorText}`);
            }

            const result = await response.json();
            const reviewText = result.choices[0].message.content;

            // Постим комментарий в PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: reviewText + trimmedNote + '\n\n---\n*Автоматическое ревью от GPT-4.1 через GitHub Models API*'
            });

            console.log('Review posted successfully');
